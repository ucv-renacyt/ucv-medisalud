<app-header-estudiante-ms [showMenu]="true" title="Perfil"></app-header-estudiante-ms>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<ion-content class="ion-padding-top ion-text-center">
  <ion-card>
<i class="fa-solid fa-user" style="color: #ffc136; font-size: 7rem; margin: 1rem auto;"></i>
    <ion-card-header>
      <ion-card-title class="user-name">{{ user()?.name }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item lines="none" class="user-info">
        <ion-label>
          <h2>Teléfono:</h2>
          <p>{{ user()?.phone }}</p>
        </ion-label>
      </ion-item>

      <ion-item lines="none" class="user-info">
        <ion-label>
          <h2>DNI:</h2>
          <p>{{ user()?.dni }}</p>
        </ion-label>
      </ion-item>

      <ion-item lines="none" class="user-info">
        <ion-label>
          <h2>Facultad:</h2>
          <p>{{ user()?.facultad }}</p>
        </ion-label>
      </ion-item>

      <ion-item lines="none" class="user-info">
        <ion-label>
          <h2>Email:</h2>
          <p>{{ user()?.email }}</p>
        </ion-label>
      </ion-item>

      <ion-item button detail>
        <ion-label routerLink="/terms">Términos & Condiciones</ion-label>
      </ion-item>

      <br /><br /><br /><br /><br /><br /><br /><br /><br />
    </ion-card-content>
  </ion-card>
</ion-content>
